name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libuv1-dev zlib1g-dev pkg-config cmake
      - run: Rscript --vanilla scripts/install.R
      - run: Rscript --vanilla tests/models.R
      - run: Rscript --vanilla tests/http.R
      - run: Rscript --vanilla examples/generate.R
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/site.mjs
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t loadings-mcp:test .
      - run: docker run -d --name mcp -e PORT=8090 -p 8090:8090 loadings-mcp:test
      - name: Initialize over HTTP
        run: |
          for i in $(seq 1 30); do
            if curl --fail -sS -X POST http://localhost:8090/mcp -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' | tee /tmp/initialize.json | grep -q 'protocolVersion'; then exit 0; fi
            sleep 2
          done
          docker logs mcp
          exit 1
